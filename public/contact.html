<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Blok Yarışı</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #1a1f3c, #2d1b4e);
    color: #fff; line-height: 1.6; padding: 24px 16px 60px;
    display: flex; align-items: flex-start; justify-content: center;
  }
  .wrap { max-width: 480px; width: 100%; margin-top: 10vh; text-align: center; }
  h1 { font-size: 26px; margin-bottom: 16px; }
  p { font-size: 15px; opacity: 0.9; margin-bottom: 20px; }
  a.mail {
    display: inline-block; background: linear-gradient(90deg, #ffd76b, #ff8a65);
    color: #4a2c00; font-weight: 800; padding: 14px 28px; border-radius: 12px;
    text-decoration: none; font-size: 16px;
  }
  .back { display: block; margin-top: 28px; color: #4dc3ff; text-decoration: none; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📨 Contact</h1>
  <p>Have a question, a suggestion, or run into a problem? Reach out to us — we try to get
  back to you as quickly as we can.</p>
  <a class="mail" href="mailto:[SUPPORT_EMAIL_HERE]">[SUPPORT_EMAIL_HERE]</a>
  <a class="back" href="/">&larr; Back to Blok Yarışı</a>
</div>
</body>
</html>
